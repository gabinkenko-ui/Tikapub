[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tikapub"
version = "0.1.0"
description = "Création et publication automatique de vidéos de différentes natures sur TikTok"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "click>=8.1",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "pillow>=10.0",
    "moviepy>=1.0.3,<2",
    "gTTS>=2.5",
    "imageio-ffmpeg>=0.4.9",
    "numpy>=1.24",
]

[project.optional-dependencies]
ai-script = ["openai>=1.30"]
align = ["faster-whisper>=1.0"]
dev = ["pytest>=8.0"]

[project.scripts]
tikapub = "tikapub.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
